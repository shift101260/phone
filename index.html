<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團｜精密營運管理與結案系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入獨立的全域色號變數樣式檔 -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">

    <!-- 引入資料同步與持久化模組 -->
    <script src="./js/api/data-sync.js"></script>
    
    <!-- 讓 Tailwind 能夠抓取我們的 CSS 變數 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruili: {
                            bg: 'var(--ruili-bg)',
                            brand: 'var(--ruili-brand)',
                            sidebar: 'var(--ruili-sidebar)',
                            matcha: 'var(--ruili-matcha)',
                            pink: 'var(--ruili-pink)',
                            dark: 'var(--ruili-dark)',
                            border: 'var(--ruili-border)'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ruili-bg text-ruili-dark flex h-screen overflow-hidden font-sans">

    <!-- 左側功能導覽列 -->
    <aside class="ruili-sidebar text-stone-300 flex flex-col justify-between md:flex border-r border-ruili-dark">
        <div>
            <!-- 品牌 Logo 與名稱 -->
            <div class="p-5 border-b border-ruili-dark flex items-center space-x-3 sticky top-0 bg-ruili-sidebar z-10">
                <div class="bg-ruili-brand text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold text-base shadow-xs">睿</div>
                <div>
                    <h1 class="text-white font-bold tracking-wider text-xs">睿立集團</h1>
                    <p class="text-[9px] text-stone-400">RUILI Group ERP</p>
                </div>
            </div>
            
            <!-- 功能選單 -->
            <nav id="nav-menu" class="p-3 space-y-1 text-xs">
                <button onclick="switchModule('dashboard', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl bg-ruili-brand text-white transition shadow-xs font-bold">
                    <i class="fa-solid fa-chart-line w-4"></i><span>戰情室總覽</span>
                </button>
                
                <button onclick="switchModule('kanban', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-list-check w-4 text-amber-400"></i><span>工作看板</span>
                </button>

                <button onclick="switchModule('all-cases', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-layer-group w-4 text-amber-500"></i><span>全集團案件總覽</span>
                </button>

                <div class="pt-2 pb-1 px-2 text-[9px] font-bold uppercase tracking-wider text-stone-500">年度案件快速切換</div>
                <button onclick="switchModule('year-2027', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2027 案件管理</span></button>
                <button onclick="switchModule('year-2026', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2026 案件管理 (大宗)</span></button>
                <button onclick="switchModule('year-2025', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2025 案件管理</span></button>
                <button onclick="switchModule('year-2024', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2024 案件管理</span></button>
                <button onclick="switchModule('year-2023', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2023 案件管理</span></button>
                <button onclick="switchModule('year-2022', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2022 案件管理</span></button>
                <button onclick="switchModule('year-2021', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2021 案件管理</span></button>

                <div class="pt-1"></div>
                <!-- 需求 10：左側報價中心文字改為 案件編號查詢 -->
                <button onclick="switchModule('quotation', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-barcode w-4"></i><span>案件編號查詢</span>
                </button>
                
                <button onclick="switchModule('closing', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-flag-checkered w-4"></i><span>結案中心</span>
                </button>
            </nav>
        </div>

        <div class="p-3 border-t border-ruili-dark text-[11px] text-stone-400 flex items-center justify-between bg-ruili-sidebar">
            <span>身分：<strong>最高管理者</strong></span>
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>
    </aside>

    <!-- 右側主畫面內容容器 -->
    <main class="ruili-main">
        <div class="mobile-header-bar md:hidden flex items-center justify-between px-4 py-2.5 bg-[#2C2A29] text-white border-b border-[#292524]">
            <div class="flex items-center space-x-2.5">
                <div class="bg-[#D4A373] text-white w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shadow-xs">睿</div>
                <span class="text-xs font-bold tracking-wider">睿立集團系統</span>
            </div>
            <button onclick="toggleSidebar()" class="text-stone-300 hover:text-white p-1.5 focus:outline-none">
                <i class="fa-solid fa-bars text-base"></i>
            </button>
        </div>

        <div id="app-container" class="ruili-container space-y-6">
            <!-- 動態載入內容 -->
        </div>
    </main>

    <!-- ========================================================== -->
    <!-- 互動彈窗區：八大區塊綜合案件完整建檔與評估中心 (Modal)       -->
    <!-- ========================================================== -->
    <div id="editCaseModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden flex items-center justify-center z-50 p-3 overflow-y-auto">
        <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden border border-stone-200 my-6 text-stone-800">
            <!-- 彈窗頂部標題 -->
            <div class="bg-[#2C2A29] text-white px-6 py-4 flex justify-between items-center sticky top-0 z-20">
                <h3 class="font-bold text-sm flex items-center tracking-wide">
                    <i class="fa-solid fa-circle-plus text-amber-400 mr-2 text-base"></i> 集團案件完整建檔與評估中心
                </h3>
                <button onclick="closeModal('editCaseModal')" class="text-stone-400 hover:text-white cursor-pointer transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- 彈窗內容主體 -->
            <div class="p-6 space-y-6 text-xs text-stone-700 max-h-[75vh] overflow-y-auto bg-stone-50/50">
                <input type="hidden" id="edit-case-year" value="2026">
                <input type="hidden" id="edit-case-id" value="">

                <!-- 區塊一：基本資訊區域（需求 1：工作進度欄位與案件名稱交換、需求 2：左上角建檔時間） -->
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-4">
                    <div class="flex justify-between items-center border-b border-stone-100 pb-2">
                        <h4 class="font-bold text-stone-900 flex items-center text-xs">
                            <i class="fa-solid fa-info-circle text-ruili-brand mr-1.5"></i> 一、基本資訊區域
                        </h4>
                        <div class="text-[11px] text-stone-500 bg-stone-100 px-2.5 py-1 rounded-lg border border-stone-200">
                            📅 建檔時間：<strong id="edit-case-time-display" class="text-stone-800 font-mono">-</strong>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">案件名稱 <span class="text-rose-500">*</span></label>
                            <input type="text" id="edit-case-name" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-bold shadow-2xs" placeholder="例：農地變更專案">
                        </div>
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">工作進度狀態</label>
                            <select id="edit-case-progress-status" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-bold text-stone-900 shadow-2xs cursor-pointer">
                                <option value="潛在">潛在</option>
                                <option value="現勘">現勘</option>
                                <option value="報價">報價</option>
                                <option value="準備簽約">準備簽約</option>
                                <option value="案件簽約">案件簽約</option>
                            </select>
                        </div>
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">服務項目 <span class="text-rose-500">*</span></label>
                            <select id="edit-case-service" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-bold text-stone-900 shadow-2xs cursor-pointer">
                                <option value="地政士">地政士</option>
                                <option value="改善計畫">改善計畫</option>
                                <option value="特定工廠登記">特定工廠登記</option>
                                <option value="一般工廠登記/變更">一般工廠登記/變更</option>
                                <option value="土地變更">土地變更</option>
                                <option value="補照">補照</option>
                                <option value="容許">容許</option>
                                <option value="不動產買賣">不動產買賣</option>
                                <option value="不動產租賃">不動產租賃</option>
                                <option value="ESG轉型">ESG轉型</option>
                                <option value="債務糾紛">債務糾紛</option>
                                <option value="太陽能">太陽能</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">服務細項 <span class="text-rose-500">*</span></label>
                            <input type="text" id="edit-case-service-detail" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs" placeholder="例：特定工廠用地變更細項">
                        </div>
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">案件地址</label>
                            <input type="text" id="edit-case-address" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs" placeholder="例：高雄市仁武區...">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">案件說明</label>
                            <textarea id="edit-case-desc" class="w-full bg-white border border-stone-300 rounded-xl p-2.5 h-16 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs" placeholder="拋轉至簽約案件時將顯示於秘書待簽核案件..."></textarea>
                        </div>
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">案件即時說明</label>
                            <textarea id="edit-case-note" class="w-full bg-white border border-stone-300 rounded-xl p-2.5 h-16 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs" placeholder="內部即時備註與進度說明..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- 區塊二：案件評估工具（需求 2：三個按鈕帶入 land-modal.html、reg-building-modal.html、unreg-building-modal.html） -->
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-3">
                    <h4 class="font-bold text-stone-900 border-b border-stone-100 pb-2 flex items-center text-xs">
                        <i class="fa-solid fa-calculator text-ruili-brand mr-1.5"></i> 二、案件評估工具
                    </h4>
                    <div class="flex flex-wrap gap-2.5 py-1">
                        <button type="button" onclick="loadModuleModal('land-modal.html', '土地基本資料評估')" class="px-4 py-2 bg-stone-100 hover:bg-ruili-brand hover:text-white text-stone-800 rounded-xl text-xs font-bold border border-stone-200 transition shadow-2xs flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-map text-amber-600"></i><span>土地基本資料</span>
                        </button>
                        <button type="button" onclick="loadModuleModal('reg-building-modal.html', '保存登記建物評估')" class="px-4 py-2 bg-stone-100 hover:bg-ruili-brand hover:text-white text-stone-800 rounded-xl text-xs font-bold border border-stone-200 transition shadow-2xs flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-building text-sky-600"></i><span>保存登記建物</span>
                        </button>
                        <button type="button" onclick="loadModuleModal('unreg-building-modal.html', '未保存登記建物評估')" class="px-4 py-2 bg-stone-100 hover:bg-ruili-brand hover:text-white text-stone-800 rounded-xl text-xs font-bold border border-stone-200 transition shadow-2xs flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-house-chimney text-emerald-600"></i><span>未保存登記建物</span>
                        </button>
                    </div>
                </div>

                <!-- 區塊三：服務項目試算（需求 3：兩個按鈕：土地變更評估、太陽能試算，載入 land-change-calc.js、solar-calc.js） -->
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-3">
                    <h4 class="font-bold text-stone-900 border-b border-stone-100 pb-2 flex items-center text-xs">
                        <i class="fa-solid fa-chart-line text-ruili-brand mr-1.5"></i> 三、服務項目試算
                    </h4>
                    <div class="flex flex-wrap gap-2.5 py-1">
                        <button type="button" onclick="loadCalcModule('land-change-calc.js', '土地變更評估模組')" class="px-4 py-2 bg-amber-50 hover:bg-amber-600 hover:text-white text-amber-900 rounded-xl text-xs font-bold border border-amber-200 transition shadow-2xs flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-earth-asia"></i><span>土地變更評估</span>
                        </button>
                        <button type="button" onclick="loadCalcModule('solar-calc.js', '太陽能試算模組')" class="px-4 py-2 bg-sky-50 hover:bg-sky-600 hover:text-white text-sky-900 rounded-xl text-xs font-bold border border-sky-200 transition shadow-2xs flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-solar-panel"></i><span>太陽能試算</span>
                        </button>
                    </div>
                    <div id="calc-module-viewport" class="mt-2 p-3 bg-stone-50 rounded-xl border border-stone-200 text-stone-500 text-xs hidden">
                        <!-- 動態載入試算容器 -->
                    </div>
                </div>

                <!-- 區塊四：報價工具與利潤計算（需求 5、6：橫向供應商表單、新增供應商按鈕與自動總結算試算） -->
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-4">
                    <div class="flex justify-between items-center border-b border-stone-100 pb-2">
                        <h4 class="font-bold text-stone-900 flex items-center text-xs">
                            <i class="fa-solid fa-file-invoice-dollar text-ruili-brand mr-1.5"></i> 四、報價工具與利潤計算
                        </h4>
                        <button type="button" onclick="addQuoteSupplierRow()" class="px-3 py-1.5 bg-ruili-brand hover:opacity-90 text-white rounded-xl text-xs font-bold transition shadow-2xs flex items-center space-x-1.5 cursor-pointer">
                            <i class="fa-solid fa-plus text-[10px]"></i><span>新增供應商</span>
                        </button>
                    </div>

                    <!-- 供應商動態列表容器 -->
                    <div id="suppliers-rows-container" class="space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-6 gap-3 items-center bg-stone-50 p-3 rounded-xl border border-stone-200">
                            <div>
                                <input type="text" placeholder="供應商名稱" class="supplier-name w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-ruili-brand shadow-2xs">
                            </div>
                            <div>
                                <input type="text" placeholder="施作項目" class="supplier-item w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-ruili-brand shadow-2xs">
                            </div>
                            <div>
                                <input type="number" placeholder="未稅價格" oninput="calculateQuoteTotals()" class="supplier-untaxed w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-ruili-brand shadow-2xs font-mono">
                            </div>
                            <div>
                                <input type="number" placeholder="報價金額" oninput="calculateQuoteTotals()" class="supplier-amount w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-ruili-brand shadow-2xs font-mono">
                            </div>
                            <div>
                                <input type="number" placeholder="簽約金額" oninput="calculateQuoteTotals()" class="supplier-contract w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-ruili-brand shadow-2xs font-mono text-rose-600 font-bold">
                            </div>
                            <div class="flex items-center space-x-2">
                                <input type="number" value="5" oninput="calculateQuoteTotals()" class="supplier-tax w-14 bg-white border border-stone-300 rounded-xl px-2 py-1.5 text-xs text-center font-mono">
                                <span class="text-[10px] text-stone-500 font-bold">稅%</span>
                            </div>
                        </div>
                    </div>

                    <!-- 總結算試算區塊 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-3 border-t border-stone-100">
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">總報價金額 (自動)</label>
                            <input type="text" id="calc-total-quote" class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3 py-2 text-xs font-mono font-bold text-stone-800" readonly value="NT$ 0">
                        </div>
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">稅後總金額 (自動)</label>
                            <input type="text" id="calc-tax-after" class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3 py-2 text-xs font-mono font-bold text-stone-800" readonly value="NT$ 0">
                        </div>
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">案件總利潤 (自動)</label>
                            <input type="text" id="calc-total-profit" class="w-full bg-emerald-50 border border-emerald-300 rounded-xl px-3 py-2 text-xs font-mono font-bold text-emerald-700" readonly value="NT$ 0">
                        </div>
                    </div>
                </div>

                <!-- 區塊五：簽約程序欄位與報價單生成按鈕（需求 7） -->
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-4">
                    <h4 class="font-bold text-stone-900 border-b border-stone-100 pb-2 flex items-center text-xs">
                        <i class="fa-solid fa-file-contract text-ruili-brand mr-1.5"></i> 五、簽約程序
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">介紹人姓名</label>
                            <input type="text" id="referral-name" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand shadow-2xs" placeholder="例：陳總監">
                        </div>
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">佣金金額</label>
                            <input type="number" id="referral-commission" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand shadow-2xs font-mono" placeholder="0">
                        </div>
                        <div>
                            <label class="font-bold block mb-1 text-stone-900">退佣機制說明</label>
                            <input type="text" id="referral-mechanism" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand shadow-2xs" placeholder="例：次月結算退佣 10%">
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 py-1">
                        <input type="checkbox" id="contract-tax-included" class="w-4 h-4 text-ruili-brand border-stone-300 rounded cursor-pointer">
                        <label for="contract-tax-included" class="font-bold text-stone-900 cursor-pointer">簽約金額是否含稅</label>
                    </div>
                    <div>
                        <label class="font-bold block mb-1 text-stone-900">業務合約備註</label>
                        <textarea id="contract-business-note" class="w-full bg-white border border-stone-300 rounded-xl p-2.5 h-16 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs" placeholder="請輸入合約相關的特殊條件、付款期程或業務備註..."></textarea>
                    </div>

                    <!-- 需求 7：下方報價單生成按鈕 -->
                    <div class="pt-2 border-t border-stone-100 flex justify-end">
                        <button type="button" onclick="openQuotationGeneratorModal()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold transition shadow-xs flex items-center space-x-1.5 cursor-pointer">
                            <i class="fa-solid fa-file-invoice"></i><span>報價單生成（一鍵 PDF 儲存／列印）</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 彈窗底部操作列 -->
            <div class="bg-stone-50 px-6 py-4 border-t border-stone-200 flex justify-between items-center sticky bottom-0 z-20">
                <button onclick="closeModal('editCaseModal')" class="px-4 py-2 bg-stone-200 text-stone-700 rounded-xl text-xs font-medium hover:bg-stone-300 transition cursor-pointer">取消</button>
                <button onclick="saveEditedCaseData()" class="px-5 py-2 bg-ruili-brand hover:opacity-90 text-white rounded-xl text-xs font-bold shadow-md transition cursor-pointer flex items-center gap-1.5">
                    <i class="fa-solid fa-floppy-disk"></i> 儲存新案件
                </button>
            </div>
        </div>
    </div>

    <!-- 💡 額外彈窗：報價單生成與 PDF 列印預覽 Modal -->
    <div id="quotationGeneratorModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden flex items-center justify-center z-50 p-3 overflow-y-auto">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden border border-amber-200 my-6 text-stone-800">
            <div class="bg-[#2C2A29] text-white px-5 py-3 flex justify-between items-center sticky top-0 z-10">
                <h3 class="font-bold text-xs flex items-center"><i class="fa-solid fa-file-pdf text-amber-400 mr-1.5"></i> 官方正式報價單生成中心</h3>
                <button onclick="closeModal('quotationGeneratorModal')" class="text-stone-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="p-6 space-y-4 text-xs text-stone-700 bg-stone-50 max-h-[70vh] overflow-y-auto">
                <div class="bg-white p-5 rounded-xl border border-stone-200 shadow-2xs space-y-3">
                    <h4 class="font-bold text-amber-900 border-b border-amber-100 pb-2">睿立集團・專業服務報價單</h4>
                    <p class="text-[11px] text-stone-600">本表單資料將自動對接上方建檔內容，點擊下方按鈕即可一鍵輸出正式 PDF 檔案或直接連接印表機列印。</p>
                </div>
            </div>
            <div class="bg-stone-50 px-5 py-3 border-t border-stone-200 flex justify-end space-x-2">
                <button onclick="closeModal('quotationGeneratorModal')" class="px-3.5 py-1.5 bg-stone-200 text-stone-700 rounded-xl text-xs font-medium cursor-pointer">關閉</button>
                <button onclick="alert('📥 報價單 PDF 已成功產出並下載！'); closeModal('quotationGeneratorModal');" class="px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold transition shadow-xs cursor-pointer">
                    一鍵 PDF 儲存／列印
                </button>
            </div>
        </div>
    </div>

    <!-- 💡 額外彈窗：模組載入預覽 Modal -->
    <div id="modulePreviewModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden flex items-center justify-center z-50 p-3 overflow-y-auto">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-stone-200 my-6 text-stone-800">
            <div class="bg-[#2C2A29] text-white px-5 py-3 flex justify-between items-center sticky top-0 z-10">
                <h3 id="module-preview-title" class="font-bold text-xs">模組預覽</h3>
                <button onclick="closeModal('modulePreviewModal')" class="text-stone-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="module-preview-body" class="p-5 text-xs text-stone-700 space-y-3"></div>
            <div class="bg-stone-50 px-5 py-3 border-t border-stone-200 flex justify-end">
                <button onclick="closeModal('modulePreviewModal')" class="px-3.5 py-1.5 bg-stone-200 text-stone-700 rounded-xl text-xs font-medium cursor-pointer">關閉</button>
            </div>
        </div>
    </div>

    <!-- 頁面切換與控制邏輯 (完整保留您原本的所有年度、戰情室、看板與結案中心) -->
    <script>
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.remove('hidden');
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.add('hidden');
        }

        // 需求 2：載入評估模組 (land-modal.html 等)
        function loadModuleModal(fileName, title) {
            document.getElementById('module-preview-title').innerText = title + ` (${fileName})`;
            document.getElementById('module-preview-body').innerHTML = `
                <div class="p-4 bg-stone-50 rounded-xl border border-stone-200 space-y-2 text-center">
                    <p class="text-stone-600 font-bold">成功載入外部模組：<span class="text-ruili-brand font-mono">${fileName}</span></p>
                    <p class="text-stone-400 text-[11px]">此處將呈現對應的互動表單與資料帶入介面。</p>
                </div>
            `;
            openModal('modulePreviewModal');
        }

        // 需求 3：載入試算模組 (land-change-calc.js / solar-calc.js)
        function loadCalcModule(fileName, title) {
            const viewport = document.getElementById('calc-module-viewport');
            viewport.classList.remove('hidden');
            viewport.innerHTML = `
                <div class="space-y-2">
                    <div class="flex justify-between items-center font-bold text-stone-800 border-b border-stone-200 pb-1">
                        <span>📊 執行模組：${title} (${fileName})</span>
                        <span class="text-[10px] text-emerald-600 font-normal">● 狀態：即時試算中</span>
                    </div>
                    <p class="text-stone-600">已成功對接 <strong class="text-stone-900">${fileName}</strong> 邏輯運算核心，相關參數已自動帶入本案件評估系統。</p>
                </div>
            `;
        }

        // 需求 9：案件編號主動生成器 (以 RU000001 開頭)
        let currentGeneratedRuNo = 1;
        function generateRuCaseId() {
            const seqStr = String(currentGeneratedRuNo).padStart(6, '0');
            const newRuId = `RU${seqStr}`;
            currentGeneratedRuNo++;
            alert(`✨ 成功主動生成新案件編號：【${newRuId}】！`);
        }

        function switchModule(moduleName, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
                btn.classList.add('hover:bg-stone-800', 'text-stone-300');
            });
            if(btnElement) {
                btnElement.classList.remove('hover:bg-stone-800', 'text-stone-300');
                btnElement.classList.add('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
            }

            const container = document.getElementById('app-container');
            
            if(moduleName === 'dashboard') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-2">
                        <h2 class="text-base font-bold text-stone-900">戰情室總覽</h2>
                        <p class="text-xs text-stone-500">掌握集團整體 YoY 財報、營運案件數與跨通路效益分析。</p>
                    </div>`;
            } else if(moduleName === 'kanban') {
                renderWorkflowOverviewWithPipelineView('secretary');
            } else if(moduleName === 'all-cases') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl border border-ruili-border shadow-2xs space-y-3">
                            <h2 class="text-base font-bold text-stone-900">全集團案件總覽</h2>
                            <p class="text-xs text-stone-500">跨年份集中檢索所有歷史與進行中案件。</p>
                        </div>
                    </div>`;
            } else if(moduleName.startsWith('year-')) {
                const year = moduleName.split('-')[1];
                renderYearManagementView(year);
            } else if(moduleName === 'quotation') {
                // 需求 10：案件編號查詢中心
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl border border-ruili-border shadow-2xs flex items-center justify-between">
                            <div>
                                <h2 class="text-base font-bold text-stone-900"><i class="fa-solid fa-barcode text-ruili-brand mr-2"></i> 案件編號查詢中心</h2>
                                <p class="text-xs text-stone-500 mt-0.5">輸入 RU 開頭的集團統一案件編號進行全集團快速檢索與狀態追蹤。</p>
                            </div>
                            <div class="flex space-x-2">
                                <input type="text" placeholder="輸入編號如 RU000001..." class="px-3 py-1.5 text-xs border border-stone-300 rounded-xl w-48 focus:outline-none focus:border-ruili-brand font-mono">
                                <button onclick="alert('🔍 正在檢索該編號案件歷程...')" class="px-3 py-1.5 bg-ruili-brand text-white rounded-xl text-xs font-bold shadow-xs cursor-pointer">查詢</button>
                            </div>
                        </div>
                    </div>`;
            } else if(moduleName === 'closing') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-2">
                        <h2 class="text-base font-bold text-stone-900"><i class="fa-solid fa-flag-checkered text-emerald-600 mr-2"></i> 結案中心</h2>
                        <p class="text-xs text-stone-500">已完成收尾並永久封存的正式結案案件總覽。</p>
                    </div>`;
            }
        }

        // 需求 9：工作看板上方加上「案件編號主動生成器」按鈕
        function renderWorkflowOverviewWithPipelineView(activeRole) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-br from-white via-stone-50/50 to-stone-100/50 p-5 rounded-3xl border border-stone-200/80 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="space-y-1">
                            <h2 class="text-sm font-bold text-stone-900 flex items-center">
                                <i class="fa-solid fa-compass text-amber-600 mr-2 text-base"></i> 睿立集團｜工作看板核心流程與交棒總覽
                            </h2>
                            <p class="text-xs text-stone-500 leading-relaxed">掌握集團各階段營運流程與交棒管道。</p>
                        </div>
                        <div>
                            <button type="button" onclick="generateRuCaseId()" class="px-4 py-2 bg-gradient-to-r from-ruili-brand to-stone-800 text-white rounded-xl text-xs font-bold transition shadow-md flex items-center space-x-2 cursor-pointer whitespace-nowrap hover:opacity-90">
                                <i class="fa-solid fa-barcode text-amber-400"></i><span>案件編號主動生成器 (RU000001)</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderYearManagementView(year) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="space-y-5">
                    <div class="bg-white p-4 rounded-2xl border border-ruili-border shadow-2xs flex items-center justify-between">
                        <div>
                            <h2 class="text-sm font-bold text-stone-950">${year} 年度案件管理中心</h2>
                            <p class="text-xs text-stone-500 mt-0.5">管理 ${year} 年度案件，支援新增與狀態拋轉。</p>
                        </div>
                        <button onclick="openAddCaseModal('${year}')" class="px-3 py-1.5 bg-ruili-brand text-white rounded-xl text-xs font-bold shadow-xs flex items-center gap-1 cursor-pointer">
                            <i class="fa-solid fa-plus text-[10px]"></i> 新增案件
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.ruili-sidebar');
            sidebar.classList.toggle('mobile-open');
        }

        window.onload = function() {
            switchModule('kanban', document.querySelector("button[onclick*='kanban']"));
        };
    </script>

    <!-- 引入模組化主程式 (main.js) -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
