<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團｜精密營運管理與跨角色交棒系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruili: {
                            bg: 'var(--ruili-bg)',
                            brand: 'var(--ruili-brand)',
                            sidebar: 'var(--ruili-sidebar)',
                            matcha: 'var(--ruili-matcha)',
                            pink: 'var(--ruili-pink)',
                            dark: 'var(--ruili-dark)',
                            border: 'var(--ruili-border)'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ruili-bg text-ruili-dark flex h-screen overflow-hidden font-sans">

    <!-- 左側功能導覽列 -->
    <aside class="ruili-sidebar text-stone-300 flex flex-col justify-between md:flex border-r border-ruili-dark">
        <div>
            <div class="p-6 border-b border-ruili-dark flex items-center space-x-3 sticky top-0 bg-ruili-sidebar z-10">
                <div class="bg-ruili-brand text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl shadow-xs">睿</div>
                <div>
                    <h1 class="text-white font-bold tracking-wider text-sm">睿立集團</h1>
                    <p class="text-[10px] text-stone-400">RUILI Group ERP (200+ Cases)</p>
                </div>
            </div>
            
            <nav id="nav-menu" class="p-4 space-y-1.5 text-xs">
                <button onclick="switchModule('dashboard', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl bg-ruili-brand text-white transition shadow-xs font-bold">
                    <i class="fa-solid fa-chart-line w-5"></i><span>戰情室總覽</span>
                </button>
                
                <button onclick="switchModule('handoff-pipeline', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-people-arrows w-5 text-amber-400"></i><span>跨角色交棒專屬列表</span>
                </button>

                <button onclick="switchModule('kanban', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-list-check w-5"></i><span>工作看板 SOP (全景)</span>
                </button>

                <button onclick="switchModule('all-cases', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl hover:bg-stone-800 text-stone-300 transition">
                    <i class="fa-solid fa-layer-group w-5 text-amber-500"></i><span>全集團案件總覽 (200+)</span>
                </button>

                <div class="pt-2 pb-1 px-3 text-[10px] font-bold uppercase tracking-wider text-stone-500">年度案件快速切換</div>
                <button onclick="switchModule('year-2027', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2027 案件管理</span></button>
                <button onclick="switchModule('year-2026', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2026 案件管理 (大宗)</span></button>
                <button onclick="switchModule('year-2025', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-4 ml-1"></i><span>2025 案件管理</span></button>
            </nav>
        </div>

        <div class="p-4 border-t border-ruili-dark text-xs text-stone-400 flex items-center justify-between bg-ruili-sidebar">
            <span>身分：<strong>最高管理者 / 品牌長</strong></span>
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        </div>
    </aside>

    <!-- 右側主畫面內容容器 -->
    <main class="ruili-main">
        <div class="mobile-header-bar md:hidden flex items-center justify-between px-4 py-3 bg-[#2C2A29] text-white border-b border-[#292524]">
            <div class="flex items-center space-x-3">
                <div class="bg-[#D4A373] text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm shadow-xs">睿</div>
                <span class="text-xs font-bold tracking-wider">睿立集團系統</span>
            </div>
            <button onclick="toggleSidebar()" class="text-stone-300 hover:text-white p-2 focus:outline-none">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
        </div>

        <div id="app-container" class="ruili-container space-y-6">
            <!-- 預設載入內容 -->
        </div>
    </main>

    <!-- 彈窗模板：拋轉與角色交棒對話框 -->
    <div id="handoffModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-stone-200">
            <div class="bg-[#2C2A29] text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-sm"><i class="fa-solid fa-share-nodes text-ruili-brand mr-2"></i> 案件階段完成與一鍵拋轉交棒</h3>
                <button onclick="closeModal('handoffModal')" class="text-stone-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 space-y-4 text-xs text-stone-700">
                <div class="bg-stone-50 p-3 rounded-xl border border-stone-200">
                    <span class="text-stone-400 block text-[10px]">目前操作案件</span>
                    <strong id="modal-case-name" class="text-stone-900 text-sm">彰化員林農地變更專案 (2026-001)</strong>
                </div>
                <div>
                    <label class="font-bold block mb-1 text-stone-900">指定下一個交棒角色 / 負責人：</label>
                    <select id="next-role-select" class="w-full bg-stone-50 border border-stone-300 rounded-xl p-2.5 font-bold text-stone-900 focus:outline-none">
                        <option value="secretary">秘書室 (合規與歸檔覆核)</option>
                        <option value="surveyor">地政士團隊 (土地測量與法規送件)</option>
                        <option value="assistant">特助專員 (特登案專責 / 全程追蹤)</option>
                        <option value="accountant">財務長 / 會計室 (階段請款與發票開立)</option>
                    </select>
                </div>
                <div>
                    <label class="font-bold block mb-1 text-stone-900">交棒交辦事項與備註：</label>
                    <textarea class="w-full bg-stone-50 border border-stone-300 rounded-xl p-3 h-20 text-xs focus:outline-none font-medium" placeholder="請輸入移交注意事項...">初審同意書已發下，請財務長進行第二期款 30% 請款作業。</textarea>
                </div>
            </div>
            <div class="bg-stone-50 px-6 py-3 border-t border-stone-200 flex justify-end space-x-3">
                <button onclick="closeModal('handoffModal')" class="px-4 py-2 bg-stone-200 text-stone-700 rounded-xl font-medium">取消</button>
                <button onclick="executeHandoffAction()" class="px-5 py-2 bg-ruili-brand text-white rounded-xl font-bold shadow-xs">確認完成並拋轉交棒</button>
            </div>
        </div>
    </div>

    <!-- 系統 JavaScript 邏輯 -->
    <script>
        function generateMockCases() {
            const statuses = ['簽約案件', '案件評估', '結案中心'];
            const services = ['土地變更', '特定工廠專用區', '綠能申設', '資產顧問', '土地重劃'];
            const clients = ['張董事長', '黃總經理', '林董', '陳小姐', '何董', '吳律師', '趙伯伯', '周代書', '鄭主委', '劉董'];
            
            // 模擬各角色負責人與所處階段
            const roles = [
                { roleKey: 'secretary', roleName: '秘書室', title: '1. 秘書建檔/合規審查' },
                { roleKey: 'surveyor', roleName: '地政士團隊', title: '2A. 地政士專業執行中' },
                { roleKey: 'assistant', roleName: '特助專員', title: '2B. 特助特登/全面執行中' },
                { roleKey: 'accountant', roleName: '財務長 / 會計室', title: '3. 階段請款與會計對帳' }
            ];

            let data = { '2026': [] };
            for (let i = 1; i <= 120; i++) {
                let idStr = `2026-${String(i).padStart(3, '0')}`;
                let client = clients[i % clients.length];
                let srv = services[i % services.length];
                let roleObj = roles[i % roles.length];
                let daysStalled = (i * 5) % 35; // 模擬有些案件放了很久
                let amount = ((i % 12) + 1) * 300000;

                data['2026'].push({
                    id: idStr,
                    name: `${client}(${srv}專案)`,
                    client: client,
                    service: srv,
                    roleKey: roleObj.roleKey,
                    roleName: roleObj.roleName,
                    stageTitle: roleObj.title,
                    days: daysStalled,
                    amount: `NT$ ${amount.toLocaleString()}`,
                    status: '簽約案件'
                });
            }
            return data;
        }

        let globalCasesData = generateMockCases();

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function switchModule(moduleName, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
                btn.classList.add('hover:bg-stone-800', 'text-stone-300');
            });
            if(btnElement) {
                btnElement.classList.remove('hover:bg-stone-800', 'text-stone-300');
                btnElement.classList.add('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs');
            }

            const container = document.getElementById('app-container');

            if (moduleName === 'handoff-pipeline') {
                renderHandoffPipelineView('secretary'); // 預設顯示秘書視角
            } else if (moduleName === 'kanban') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                        <h2 class="text-base font-bold text-stone-900">工作看板全景模式</h2>
                        <p class="text-xs text-stone-500">此處可檢視集團所有案件的宏觀流向。若要進行個人精準交棒，請點選左側「跨角色交棒專屬列表」。</p>
                    </div>`;
            } else if (moduleName.startsWith('year-') || moduleName === 'all-cases') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                        <h2 class="text-base font-bold text-stone-900">年度與全集團案件資料庫</h2>
                        <p class="text-xs text-stone-500">收錄超過 200 筆歷史與進行中案件，支援即時關鍵字過濾。</p>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-4">
                        <h2 class="text-base font-bold text-stone-900">戰情室總覽</h2>
                        <p class="text-xs text-stone-500">歡迎進入睿立集團精密營運系統。</p>
                    </div>`;
            }
        }

        // 🌟 核心設計：依據不同角色分流的「跨角色交棒專屬列表」
        function renderHandoffPipelineView(activeRole) {
            const container = document.getElementById('app-container');
            const rolesConfig = [
                { key: 'secretary', name: '秘書室專區', icon: 'fa-file-shield', desc: '新案建檔、合約大小章覆核與初審' },
                { key: 'surveyor', name: '地政士團隊', icon: 'fa-landmark', desc: '土地測量、法規評估與政府機關送件' },
                { key: 'assistant', name: '特助專員', icon: 'fa-user-tie', desc: '特定工廠(特登)與長年期專案全程追蹤' },
                { key: 'accountant', name: '財務長 / 會計室', icon: 'fa-coins', desc: '階段請款、發票開立與款項對帳' }
            ];

            let casesList = globalCasesData['2026'].filter(c => c.roleKey === activeRole);
            // 排序機制：把天數最久（最久沒動、可能被遺忘的案子）自動排在最上方！
            casesList.sort((a, b) => b.days - a.days);

            let tabsHtml = rolesConfig.map(r => `
                <button onclick="renderHandoffPipelineView('${r.key}')" class="px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${activeRole === r.key ? 'bg-ruili-brand text-white shadow-xs' : 'bg-white hover:bg-stone-100 text-stone-700 border border-stone-200'}">
                    <i class="fa-solid ${r.icon}"></i> ${r.name} (${globalCasesData['2026'].filter(c => c.roleKey === r.key).length})
                </button>
            `).join('');

            let cardsHtml = casesList.length > 0 ? casesList.map(c => {
                let isStalled = c.days > 14;
                let badgeClass = isStalled ? 'bg-rose-100 text-rose-700 border-rose-300' : 'bg-emerald-100 text-emerald-700 border-emerald-300';
                let dotClass = isStalled ? 'bg-rose-500 animate-ping' : 'bg-emerald-500';

                return `
                    <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs hover:border-ruili-brand transition flex flex-col justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-mono font-bold text-stone-500">${c.id}</span>
                                <span class="px-2 py-0.5 bg-stone-100 text-stone-600 rounded font-medium">${c.service}</span>
                            </div>
                            <h3 class="font-bold text-stone-900 text-sm">${c.name}</h3>
                            <p class="text-[11px] text-stone-500">目前階段：<strong class="text-stone-700">${c.stageTitle}</strong></p>
                        </div>

                        <div class="space-y-3 pt-3 border-t border-stone-100">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-stone-400">合約金額</span>
                                <span class="font-bold text-ruili-brand">${c.amount}</span>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-stone-400">在目前階段停留</span>
                                <span class="px-2 py-0.5 rounded border text-[10px] font-bold inline-flex items-center gap-1.5 ${badgeClass}">
                                    <span class="w-1.5 h-1.5 rounded-full ${dotClass}"></span>
                                    ${isStalled ? '⚠️ 已滯留 ' + c.days + ' 天 (需催辦)' : '🟢 進行中 (' + c.days + '天)'}
                                </span>
                            </div>
                            <button onclick="openModal('handoffModal')" class="w-full py-2 bg-stone-900 hover:bg-ruili-brand text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-xs">
                                <i class="fa-solid fa-share"></i> 執行完畢並一鍵拋轉交棒
                            </button>
                        </div>
                    </div>
                `;
            }).join('') : `
                <div class="col-span-full py-12 text-center text-stone-400 text-xs bg-white rounded-2xl border border-stone-200">
                    目前此角色無待辦案件，所有工作皆已交棒完畢！
                </div>
            `;

            let currentRoleDesc = rolesConfig.find(r => r.key === activeRole).desc;

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-3">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h2 class="text-base font-bold text-stone-900">跨角色交棒與個人執行專屬列表</h2>
                                <p class="text-xs text-stone-500">解決長年期案件被淹沒的問題：點選不同角色分頁，系統會自動將久置未動的案件置頂排序，確保每個人只看自己的待辦並精準交棒。</p>
                            </div>
                        </div>
                        <!-- 角色分頁切換列 -->
                        <div class="flex flex-wrap gap-2 pt-2">
                            ${tabsHtml}
                        </div>
                    </div>

                    <!-- 角色專屬說明提示 -->
                    <div class="bg-amber-50/70 border border-amber-200/80 px-4 py-3 rounded-xl flex items-center justify-between text-xs text-amber-900">
                        <span><i class="fa-solid fa-circle-info text-amber-600 mr-1.5"></i> <strong>${rolesConfig.find(r => r.key === activeRole).name}職責：</strong> ${currentRoleDesc}（系統已自動將滯留最久的案件排序在最上方）</span>
                        <span class="font-bold">待辦總數：${casesList.length} 件</span>
                    </div>

                    <!-- 卡片網格流 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${cardsHtml}
                    </div>
                </div>
            `;
        }

        function executeHandoffAction() {
            alert('✅ 案件已成功完成本階段作業，並自動發送通知與拋轉至下一個指定角色！');
            closeModal('handoffModal');
        }

        function toggleSidebar() {
            document.querySelector('.ruili-sidebar').classList.toggle('mobile-open');
        }

        window.onload = function() {
            switchModule('handoff-pipeline', document.querySelector("button[onclick*='handoff-pipeline']"));
        };
    </script>
</body>
</html>
