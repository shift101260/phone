<!DOCTYPE html> 
<html lang="zh-Hant"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>睿立集團｜精密營運管理與結案系統</title> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
     
    <!-- 引入獨立的全域色號變數樣式檔 --> 
    <link rel="stylesheet" href="./css/variables.css"> 
    <link rel="stylesheet" href="./css/layout.css"> 

    <!-- 引入資料同步與持久化模組 --> 
    <script src="./js/api/data-sync.js"></script> 
     
    <!-- 讓 Tailwind 能夠抓取我們的 CSS 變數 --> 
    <script> 
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        ruili: { 
                            bg: 'var(--ruili-bg)', 
                            brand: 'var(--ruili-brand)', 
                            sidebar: 'var(--ruili-sidebar)', 
                            matcha: 'var(--ruili-matcha)', 
                            pink: 'var(--ruili-pink)', 
                            dark: 'var(--ruili-dark)', 
                            border: 'var(--ruili-border)' 
                        } 
                    } 
                } 
            } 
        } 
    </script> 
</head> 
<body class="bg-ruili-bg text-ruili-dark flex h-screen overflow-hidden font-sans"> 

    <!-- 左側功能導覽列 --> 
    <aside class="ruili-sidebar text-stone-300 flex flex-col justify-between md:flex border-r border-ruili-dark"> 
        <div> 
            <!-- 品牌 Logo 與名稱 --> 
            <div class="p-5 border-b border-ruili-dark flex items-center space-x-3 sticky top-0 bg-ruili-sidebar z-10"> 
                <div class="bg-ruili-brand text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold text-base shadow-xs">睿</div> 
                <div> 
                    <h1 class="text-white font-bold tracking-wider text-xs">睿立集團</h1> 
                    <p class="text-[9px] text-stone-400">RUILI Group ERP</p> 
                </div> 
            </div> 
             
            <!-- 功能選單 --> 
            <nav id="nav-menu" class="p-3 space-y-1 text-xs"> 
                <button onclick="switchModule('dashboard', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl bg-ruili-brand text-white transition shadow-xs font-bold"> 
                    <i class="fa-solid fa-chart-line w-4"></i><span>戰情室總覽</span> 
                </button> 
                 
                <button onclick="switchModule('kanban', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"> 
                    <i class="fa-solid fa-list-check w-4 text-amber-400"></i><span>工作看板</span> 
                </button> 

                <button onclick="switchModule('all-cases', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"> 
                    <i class="fa-solid fa-layer-group w-4 text-amber-500"></i><span>全集團案件總覽</span> 
                </button> 

                <div class="pt-2 pb-1 px-2 text-[9px] font-bold uppercase tracking-wider text-stone-500">年度案件快速切換</div> 
                <button onclick="switchModule('year-2027', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2027 案件管理</span></button> 
                <button onclick="switchModule('year-2026', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2026 案件管理 (大宗)</span></button> 
                <button onclick="switchModule('year-2025', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2025 案件管理</span></button> 
                <button onclick="switchModule('year-2024', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2024 案件管理</span></button> 
                <button onclick="switchModule('year-2023', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2023 案件管理</span></button> 
                <button onclick="switchModule('year-2022', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2022 案件管理</span></button> 
                <button onclick="switchModule('year-2021', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-1.5 rounded-xl hover:bg-stone-800 text-stone-300 transition"><i class="fa-solid fa-folder w-3.5 ml-0.5"></i><span>2021 案件管理</span></button> 

                <div class="pt-1"></div> 
                <button onclick="switchModule('quotation', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"> 
                    <i class="fa-solid fa-barcode w-4"></i><span>案件編號查詢</span> 
                </button> 
                 
                <button onclick="switchModule('closing', this)" class="nav-btn w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl hover:bg-stone-800 text-stone-300 transition"> 
                    <i class="fa-solid fa-flag-checkered w-4"></i><span>結案中心</span> 
                </button> 
            </nav> 
        </div> 

        <div class="p-3 border-t border-ruili-dark text-[11px] text-stone-400 flex items-center justify-between bg-ruili-sidebar"> 
            <span>身分：<strong>最高管理者</strong></span> 
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 
        </div> 
    </aside> 

    <!-- 右側主畫面內容容器 --> 
    <main class="ruili-main"> 
        <div class="mobile-header-bar md:hidden flex items-center justify-between px-4 py-2.5 bg-[#2C2A29] text-white border-b border-[#292524]"> 
            <div class="flex items-center space-x-2.5"> 
                <div class="bg-[#D4A373] text-white w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shadow-xs">睿</div> 
                <span class="text-xs font-bold tracking-wider">睿立集團系統</span> 
            </div> 
            <button onclick="toggleSidebar()" class="text-stone-300 hover:text-white p-1.5 focus:outline-none"> 
                <i class="fa-solid fa-bars text-base"></i> 
            </button> 
        </div> 

        <div id="app-container" class="ruili-container space-y-6"> 
            <!-- 動態載入內容 --> 
        </div> 
    </main> 

    <!-- ========================================== --> 
    <!-- 互動彈窗模板區塊                          --> 
    <!-- ========================================== --> 

    <!-- 1-1. 秘書待簽核案件列表彈窗 --> 
    <div id="pendingListModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs hidden flex items-center justify-center z-50 p-3 overflow-y-auto"> 
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl overflow-hidden border border-stone-200 my-6"> 
            <div class="bg-[#2C2A29] text-white px-5 py-3 flex justify-between items-center sticky top-0 z-10"> 
                <h3 class="font-bold text-xs"><i class="fa-solid fa-layer-group text-amber-400 mr-1.5"></i> 秘書待簽核案件列表 (共 3 件)</h3> 
                <button onclick="closeModal('pendingListModal')" class="text-stone-400 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button> 
            </div> 
            <div class="p-4 space-y-2.5 text-xs text-stone-700 bg-stone-50 max-h-[60vh] overflow-y-auto"> 
                <p class="text-stone-500 text-[11px] mb-1">請選擇下方其中一筆待簽核案件進行合約登錄與交棒拋轉：</p> 
                <div onclick="openApprovalDetail('2026-001', '林董農地變更專案', '土地變更', 'NT$ 3,800,000', '陳經理 / 10% / 匯款退佣', '第一期 30% (訂金) / 第二期 30% (初審) / 第三期 40% (尾款)', '依客戶要求優先辦理初審與水保審查，並配合地政士時程進行變更。')" class="bg-white p-3.5 rounded-xl border border-stone-200 hover:border-ruili-brand shadow-2xs cursor-pointer transition flex justify-between items-center group"> 
                    <div class="space-y-1"> 
                        <div class="flex items-center space-x-2"> 
                            <span class="font-mono font-bold text-stone-400 text-[11px]">2026-001</span> 
                            <span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded text-[9px] font-bold">待簽核</span> 
                        </div> 
                        <h4 class="font-bold text-stone-900 text-xs group-hover:text-ruili-brand transition">林董農地變更專案 (土地變更)</h4> 
                    </div> 
                    <div class="text-right whitespace-nowrap pl-3"> 
                        <span class="text-rose-600 font-bold text-xs block">NT$ 3,800,000</span> 
                        <span class="text-stone-400 text-[9px]">點擊簽核 ➔</span> 
                    </div> 
                </div> 
            </div> 
            <div class="bg-stone-100 px-5 py-2.5 border-t border-stone-200 flex justify-end"> 
                <button onclick="closeModal('pendingListModal')" class="px-3.5 py-1.5 bg-stone-200 hover:bg-stone-300 text-stone-700 rounded-lg text-xs font-medium">關閉</button> 
            </div> 
        </div> 
    </div> 

    <!-- 1-2. 執行中案件列表彈窗 --> 
    <div id="activeCasesListModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs hidden flex items-center justify-center z-50 p-3 overflow-y-auto"> 
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl overflow-hidden border border-stone-200 my-6"> 
            <div class="bg-[#2C2A29] text-white px-5 py-3 flex justify-between items-center sticky top-0 z-10"> 
                <h3 class="font-bold text-xs"><i class="fa-solid fa-spinner text-sky-400 mr-1.5"></i> 執行中案件清單 (跨角色交棒專屬總計)</h3> 
                <button onclick="closeModal('activeCasesListModal')" class="text-stone-400 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button> 
            </div> 
            <div class="p-4 space-y-2.5 text-xs text-stone-700 bg-stone-50 max-h-[60vh] overflow-y-auto" id="active-cases-modal-content"></div> 
            <div class="bg-stone-100 px-5 py-2.5 border-t border-stone-200 flex justify-end"> 
                <button onclick="closeModal('activeCasesListModal')" class="px-3.5 py-1.5 bg-stone-200 hover:bg-stone-300 text-stone-700 rounded-lg text-xs font-medium">關閉</button> 
            </div> 
        </div> 
    </div> 

    <!-- 1-3. 案件簽核詳細表單彈窗 --> 
    <div id="approvalModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs hidden flex items-center justify-center z-50 p-3 overflow-y-auto"> 
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl overflow-hidden border border-stone-200 my-6"> 
            <div class="bg-[#2C2A29] text-white px-5 py-3 flex justify-between items-center sticky top-0 z-10"> 
                <h3 class="font-bold text-xs"><i class="fa-solid fa-file-signature text-amber-400 mr-1.5"></i> 秘書待簽核案件：合約登錄與拋轉</h3> 
                <button onclick="closeModal('approvalModal')" class="text-stone-400 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button> 
            </div> 
            <div class="p-4 space-y-4 text-xs text-stone-700 max-h-[70vh] overflow-y-auto"> 
                <div class="bg-stone-50 p-3.5 rounded-xl border border-stone-200 space-y-2.5"> 
                    <div class="grid grid-cols-2 gap-y-2.5 gap-x-4"> 
                        <div><span class="text-stone-400 block text-[9px] mb-0.5">案件編號</span><strong id="modal-case-id" class="text-stone-800 text-xs font-mono">-</strong></div> 
                        <div><span class="text-stone-400 block text-[9px] mb-0.5">案件名稱</span><strong id="modal-case-name" class="text-stone-800 text-xs">-</strong></div> 
                    </div> 
                </div> 
            </div> 
            <div class="bg-stone-50 px-5 py-3 border-t border-stone-200 flex justify-end space-x-2.5"> 
                <button onclick="closeModal('approvalModal')" class="px-3.5 py-1.5 bg-stone-200 text-stone-700 rounded-xl text-xs font-medium">返回</button> 
            </div> 
        </div> 
    </div> 

    <!-- ========================================================== --> 
    <!-- 八大區塊綜合案件完整建檔與評估表 (Modal)                    --> 
    <!-- ========================================================== --> 
    <div id="editCaseModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden flex items-center justify-center z-50 p-3 overflow-y-auto"> 
        <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden border border-stone-200 my-6 text-stone-800"> 
            <div class="bg-[#2C2A29] text-white px-6 py-4 flex justify-between items-center sticky top-0 z-20"> 
                <h3 class="font-bold text-sm flex items-center tracking-wide"> 
                    <i class="fa-solid fa-circle-plus text-amber-400 mr-2 text-base"></i> 集團案件完整建檔與評估中心 
                </h3> 
                <button onclick="closeModal('editCaseModal')" class="text-stone-400 hover:text-white cursor-pointer transition"> 
                    <i class="fa-solid fa-xmark text-lg"></i> 
                </button> 
            </div> 
             
            <div class="p-6 space-y-6 text-xs text-stone-700 max-h-[75vh] overflow-y-auto bg-stone-50/50"> 
                <input type="hidden" id="edit-case-year" value="2026"> 
                <input type="hidden" id="edit-case-id" value=""> 

                <!-- 區塊一：基本資訊區域 (已新增地段地號欄位) --> 
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-4"> 
                    <div class="flex justify-between items-center border-b border-stone-100 pb-2"> 
                        <h4 class="font-bold text-stone-900 flex items-center text-xs"> 
                            <i class="fa-solid fa-info-circle text-ruili-brand mr-1.5"></i> 一、基本資訊區域 
                        </h4> 
                        <div class="text-[11px] text-stone-500 bg-stone-100 px-2.5 py-1 rounded-lg border border-stone-200"> 
                            📅 建檔時間：<strong id="edit-case-time-display" class="text-stone-800 font-mono">-</strong> 
                        </div> 
                    </div> 
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4"> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">案件名稱 <span class="text-rose-500">*</span></label> 
                            <input type="text" id="edit-case-name" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-bold shadow-2xs" placeholder="例：農地變更專案"> 
                        </div> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">工作進度狀態</label> 
                            <select id="edit-case-progress-status" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-bold text-stone-900 shadow-2xs cursor-pointer"> 
                                <option value="潛在">潛在</option> 
                                <option value="現勘">現勘</option> 
                                <option value="報價">報價</option> 
                                <option value="準備簽約">準備簽約</option> 
                                <option value="案件簽約">案件簽約</option> 
                            </select> 
                        </div> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">服務項目 <span class="text-rose-500">*</span></label> 
                            <select id="edit-case-service" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-bold text-stone-900 shadow-2xs cursor-pointer"> 
                                <option value="地政士">地政士</option> 
                                <option value="改善計畫">改善計畫</option> 
                                <option value="特定工廠登記">特定工廠登記</option> 
                                <option value="土地變更">土地變更</option> 
                                <option value="太陽能">太陽能</option> 
                                <option value="其他">其他</option> 
                            </select> 
                        </div> 
                    </div> 
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4"> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">服務細項 <span class="text-rose-500">*</span></label> 
                            <input type="text" id="edit-case-service-detail" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs" placeholder="例：特定工廠用地變更細項"> 
                        </div> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">案件地址</label> 
                            <input type="text" id="edit-case-address" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs" placeholder="例：高雄市仁武區..."> 
                        </div> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">地段地號</label> 
                            <input type="text" id="edit-case-land-no" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs font-mono" placeholder="例：仁武段 123-4地號"> 
                        </div> 
                    </div> 
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4"> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">案件說明</label> 
                            <textarea id="edit-case-desc" class="w-full bg-white border border-stone-300 rounded-xl p-2.5 h-16 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs" placeholder="拋轉至簽約案件時將顯示於秘書待簽核案件..."></textarea> 
                        </div> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">案件即時說明</label> 
                            <textarea id="edit-case-note" class="w-full bg-white border border-stone-300 rounded-xl p-2.5 h-16 text-xs focus:outline-none focus:border-ruili-brand font-medium shadow-2xs" placeholder="內部即時備註與進度說明..."></textarea> 
                        </div> 
                    </div> 
                </div> 

                <!-- 區塊二：案件評估工具 --> 
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-3"> 
                    <h4 class="font-bold text-stone-900 border-b border-stone-100 pb-2 flex items-center text-xs"> 
                        <i class="fa-solid fa-calculator text-ruili-brand mr-1.5"></i> 二、案件評估工具 
                    </h4> 
                    <div class="flex flex-wrap gap-2.5 py-1"> 
                        <button type="button" onclick="loadModuleModal('land-modal.html', '土地基本資料評估')" class="px-4 py-2 bg-stone-100 hover:bg-ruili-brand hover:text-white text-stone-800 rounded-xl text-xs font-bold border border-stone-200 transition shadow-2xs cursor-pointer">土地基本資料</button> 
                    </div> 
                </div> 
                <!-- 💡 (已依要求拿掉原三、土地與建物基本資料欄位) -->

                <!-- 區塊四：服務項目試算 --> 
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-3"> 
                    <h4 class="font-bold text-stone-900 border-b border-stone-100 pb-2 flex items-center text-xs"> 
                        <i class="fa-solid fa-chart-line text-ruili-brand mr-1.5"></i> 四、服務項目試算 
                    </h4> 
                    <div class="flex flex-wrap gap-2.5 py-1"> 
                        <button type="button" onclick="loadCalcModule('land-change-calc.js', '土地變更評估模組')" class="px-4 py-2 bg-amber-50 hover:bg-amber-600 hover:text-white text-amber-900 rounded-xl text-xs font-bold border border-amber-200 transition shadow-2xs cursor-pointer">土地變更評估</button> 
                    </div> 
                    <div id="calc-module-viewport" class="mt-2 p-3 bg-stone-50 rounded-xl border border-stone-200 text-stone-500 text-xs hidden"></div> 
                </div> 
                <!-- 💡 (已依要求拿掉原五、土地變更評估與太陽能試算欄位) -->

                <!-- 區塊六：報價工具與利潤計算 (已在案件總利潤左側新增簽約總金額自動計算欄位) --> 
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-4"> 
                    <div class="flex justify-between items-center border-b border-stone-100 pb-2"> 
                        <h4 class="font-bold text-stone-900 flex items-center text-xs"> 
                            <i class="fa-solid fa-file-invoice-dollar text-ruili-brand mr-1.5"></i> 六、報價工具與利潤計算 
                        </h4> 
                        <button type="button" onclick="addQuoteSupplierRow()" class="px-3 py-1.5 bg-ruili-brand hover:opacity-90 text-white rounded-xl text-xs font-bold transition shadow-2xs cursor-pointer">新增供應商</button> 
                    </div> 

                    <div id="suppliers-rows-container" class="space-y-3"> 
                        <div class="grid grid-cols-1 md:grid-cols-6 gap-3 items-center bg-stone-50 p-3 rounded-xl border border-stone-200"> 
                            <div><input type="text" placeholder="供應商名稱" class="supplier-name w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs"></div> 
                            <div><input type="text" placeholder="施作項目" class="supplier-item w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs"></div> 
                            <div><input type="number" placeholder="未稅價格" oninput="calculateQuoteTotals()" class="supplier-untaxed w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs font-mono"></div> 
                            <div><input type="number" placeholder="報價金額" oninput="calculateQuoteTotals()" class="supplier-amount w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs font-mono"></div> 
                            <div><input type="number" placeholder="簽約金額" oninput="calculateQuoteTotals()" class="supplier-contract w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-xs font-mono text-rose-600 font-bold"></div> 
                            <div class="flex items-center space-x-2"> 
                                <input type="number" value="5" oninput="calculateQuoteTotals()" class="supplier-tax w-14 bg-white border border-stone-300 rounded-xl px-2 py-1.5 text-xs text-center font-mono"> 
                                <span class="text-[10px] text-stone-500 font-bold">稅%</span> 
                            </div> 
                        </div> 
                    </div> 

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-3 border-t border-stone-100"> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">總報價金額 (自動)</label> 
                            <input type="text" id="calc-total-quote" class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3 py-2 text-xs font-mono font-bold text-stone-800" readonly value="NT$ 0"> 
                        </div> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">稅後總金額 (自動)</label> 
                            <input type="text" id="calc-tax-after" class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3 py-2 text-xs font-mono font-bold text-stone-800" readonly value="NT$ 0"> 
                        </div> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">簽約總金額 (自動)</label> 
                            <input type="text" id="calc-total-contract-sum" class="w-full bg-amber-50 border border-amber-300 rounded-xl px-3 py-2 text-xs font-mono font-bold text-amber-800" readonly value="NT$ 0"> 
                        </div> 
                        <div> 
                            <label class="font-bold block mb-1 text-stone-900">案件總利潤 (自動)</label> 
                            <input type="text" id="calc-total-profit" class="w-full bg-emerald-50 border border-emerald-300 rounded-xl px-3 py-2 text-xs font-mono font-bold text-emerald-700" readonly value="NT$ 0"> 
                        </div> 
                    </div> 
                </div> 

                <!-- 區塊七、八 --> 
                <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-2xs space-y-3"> 
                    <h4 class="font-bold text-stone-900 border-b border-stone-100 pb-2 flex items-center text-xs"><i class="fa-solid fa-user-tie text-ruili-brand mr-1.5"></i> 七、案件介紹人與佣金機制</h4> 
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5"> 
                        <div><label class="font-bold block mb-1 text-stone-900">介紹人姓名</label><input type="text" id="referral-name" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs"></div> 
                        <div><label class="font-bold block mb-1 text-stone-900">佣金金額</label><input type="number" id="referral-commission" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs font-mono"></div> 
                        <div><label class="font-bold block mb-1 text-stone-900">退佣機制說明</label><input type="text" id="referral-mechanism" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs"></div> 
                    </div> 
                </div> 
            </div> 

            <div class="bg-stone-50 px-6 py-4 border-t border-stone-200 flex justify-between items-center sticky bottom-0 z-20"> 
                <button onclick="closeModal('editCaseModal')" class="px-4 py-2 bg-stone-200 text-stone-700 rounded-xl text-xs font-medium cursor-pointer">取消</button> 
                <button onclick="saveEditedCaseData()" class="px-5 py-2 bg-ruili-brand text-white rounded-xl text-xs font-bold shadow-md cursor-pointer flex items-center gap-1.5">儲存新案件</button> 
            </div> 
        </div> 
    </div> 

    <!-- 頁面切換與控制邏輯 --> 
    <script> 
        function openModal(modalId) { 
            const modal = document.getElementById(modalId); 
            if (modal) { 
                modal.classList.remove('hidden'); 
                if (modalId === 'editCaseModal') { 
                    const timeDisplay = document.getElementById('edit-case-time-display'); 
                    if (timeDisplay) { 
                        const now = new Date(); 
                        timeDisplay.innerText = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`; 
                    } 
                } 
            } 
        } 
        function closeModal(modalId) { 
            const modal = document.getElementById(modalId); 
            if (modal) modal.classList.add('hidden'); 
        } 

        // 💡 報價試算與自動加總（包含簽約總金額與總利潤）
        window.calculateQuoteTotals = function() { 
            const rows = document.querySelectorAll('#suppliers-rows-container > div'); 
            let totalQuote = 0; 
            let totalContract = 0; 

            rows.forEach(row => { 
                const amount = parseFloat(row.querySelector('.supplier-amount')?.value) || 0; 
                const contract = parseFloat(row.querySelector('.supplier-contract')?.value) || 0; 
                totalQuote += amount; 
                totalContract += contract; 
            }); 

            const totalTaxAfter = totalQuote * 1.05; 
            const totalProfit = totalContract - totalQuote; 

            const elTotal = document.getElementById('calc-total-quote'); 
            const elTaxAfter = document.getElementById('calc-tax-after'); 
            const elContractSum = document.getElementById('calc-total-contract-sum'); 
            const elProfit = document.getElementById('calc-total-profit'); 

            if (elTotal) elTotal.value = `NT$ ${totalQuote.toLocaleString()}`; 
            if (elTaxAfter) elTaxAfter.value = `NT$ ${Math.round(totalTaxAfter).toLocaleString()}`; 
            if (elContractSum) elContractSum.value = `NT$ ${totalContract.toLocaleString()}`; 
            if (elProfit) elProfit.value = `NT$ ${totalProfit.toLocaleString()}`; 
        }; 

        // 💡 案件編號主動生成器（已成功移至左側「案件編號查詢」合約中心）
        let currentGeneratedRuNo = 1; 
        function generateRuCaseId() { 
            const seqStr = String(currentGeneratedRuNo).padStart(6, '0'); 
            const newRuId = `RU${seqStr}`; 
            currentGeneratedRuNo++; 
            alert(`✨ 成功主動生成新案件編號：【${newRuId}】！`); 
        } 

        function switchModule(moduleName, btnElement) { 
            document.querySelectorAll('.nav-btn').forEach(btn => { 
                btn.classList.remove('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs'); 
                btn.classList.add('hover:bg-stone-800', 'text-stone-300'); 
            }); 
            if(btnElement) { 
                btnElement.classList.remove('hover:bg-stone-800', 'text-stone-300'); 
                btnElement.classList.add('bg-ruili-brand', 'text-white', 'font-bold', 'shadow-xs'); 
            } 

            const container = document.getElementById('app-container'); 
             
            if(moduleName === 'dashboard') { 
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-2"><h2 class="text-base font-bold text-stone-900">戰情室總覽</h2></div>`; 
            } else if(moduleName === 'kanban') { 
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs space-y-2"><h2 class="text-base font-bold text-stone-900">工作看板總覽</h2></div>`; 
            } else if(moduleName === 'quotation') { 
                // 💡 案件編號主動生成器與 WORD 雙頁合約中心
                container.innerHTML = ` 
                    <div class="space-y-6"> 
                        <div class="bg-white p-5 rounded-2xl border border-ruili-border shadow-2xs flex flex-col md:flex-row md:items-center justify-between gap-4"> 
                            <div> 
                                <h2 class="text-base font-bold text-stone-900"><i class="fa-solid fa-file-contract text-ruili-brand mr-2"></i> 案件編號查詢與 WORD 單面雙頁合約中心</h2> 
                                <p class="text-xs text-stone-500 mt-0.5">在此區塊主動生成編號，並直接填寫/套用 WORD 單面雙頁合約內容進行完整紀錄。</p> 
                            </div> 
                            <div class="flex items-center space-x-2"> 
                                <button onclick="generateRuCaseId()" class="px-3.5 py-2 bg-ruili-brand text-white rounded-xl text-xs font-bold shadow-xs cursor-pointer hover:opacity-90 flex items-center space-x-1.5 whitespace-nowrap"> 
                                    <i class="fa-solid fa-barcode text-amber-300"></i><span>生成新編號 (RU...)</span> 
                                </button> 
                                <input type="text" placeholder="輸入編號檢索..." class="px-3 py-2 text-xs border border-stone-300 rounded-xl w-36 focus:outline-none focus:border-ruili-brand font-mono"> 
                                <button onclick="alert('🔍 正在檢索該編號之合約記錄與歷程...')" class="px-3.5 py-2 bg-stone-800 text-white rounded-xl text-xs font-bold cursor-pointer">查詢</button> 
                            </div> 
                        </div> 
                        <div class="bg-white p-6 rounded-3xl border border-amber-200 shadow-xl space-y-6 text-stone-800"> 
                            <div class="border-b border-amber-200 pb-4 flex justify-between items-center"> 
                                <div> 
                                    <span class="px-2.5 py-0.5 bg-amber-100 text-amber-900 rounded-full font-bold text-[9px] uppercase tracking-wider">WORD 雙頁合約範本對接</span> 
                                    <h3 class="text-sm font-bold text-amber-900 mt-1">睿立集團・委任暨合約書（單面雙頁版）</h3> 
                                </div> 
                                <div class="text-right text-[11px] text-stone-500 font-mono">案件編號：<strong class="text-ruili-brand font-bold text-xs">RU000001</strong></div> 
                            </div> 
                        </div> 
                    </div>`; 
            } else if(moduleName === 'closing') { 
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-ruili-border shadow-2xs"><h2 class="text-base font-bold text-stone-900">結案中心</h2></div>`; 
            } 
        } 

        function toggleSidebar() { 
            document.querySelector('.ruili-sidebar').classList.toggle('mobile-open'); 
        } 

        window.onload = function() { 
            switchModule('kanban', document.querySelector("button[onclick*='kanban']")); 
        }; 
    </script> 

    <script type="module" src="./js/main.js"></script> 
</body> 
</html>
